<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标注工具集</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#1e2029 0%,#0f1116 100%);
    color:#e6e8ef;
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
    padding:20px;
  }
  .wrap{
    max-width:720px;width:100%;text-align:center;
  }
  h1{
    font-size:28px;font-weight:600;margin:0 0 12px;
    background:linear-gradient(135deg,#4c8dff,#8e44ad);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{color:#8b91a4;font-size:14px;margin-bottom:40px;}
  .cards{
    display:grid;grid-template-columns:1fr 1fr;gap:20px;
  }
  @media (max-width:600px){ .cards{grid-template-columns:1fr;} }
  .card{
    display:block;padding:32px 24px;
    background:#242731;border:1px solid #383c4a;border-radius:14px;
    color:#e6e8ef;text-decoration:none;
    transition:.2s;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:#4c8dff;
    box-shadow:0 12px 32px rgba(76,141,255,.2);
  }
  .card .icon{font-size:44px;margin-bottom:14px;}
  .card .title{font-size:17px;font-weight:600;margin-bottom:8px;}
  .card .desc{font-size:13px;color:#8b91a4;line-height:1.7;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>标注工具集</h1>
    <div class="sub">图片 · 视频 都能轻松标注</div>

    <div class="cards">
      <a class="card" href="./image-annotation.html">
        <div class="icon">🖼</div>
        <div class="title">图片标注</div>
        <div class="desc">文字 / 形状 / 涂色 / 卡片备注<br>支持导出长图和 PDF</div>
      </a>

      <a class="card" href="./video-annotation.html">
        <div class="icon">🎬</div>
        <div class="title">视频标注</div>
        <div class="desc">按时间轴添加批注 / 卡片<br>支持录屏和合成导出</div>
      </a>
    </div>
  </div>
</body>
</html>
