      const blob = buildPDF(canvases);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = `标注_${timeTag()}.pdf`;
      a.href = url;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(`已导出 ${canvases.length} 页 PDF`);
    } catch (err){
      console.error(err);
      toast('PDF 生成失败：' + err.message);
    } finally { hideLoading(); }
  }, 40);
}
function buildPDF(canvases){
  const parts = [];
  let offset = 0;
  const enc = new TextEncoder();
  const write = s => { const b = enc.encode(s); parts.push(b); offset += b.length; };
  const writeBytes = b => { parts.push(b); offset += b.length; };
  const jpegs = canvases.map(cv => {
    const dataUrl = cv.toDataURL('image/jpeg', 0.92);
    const b64 = dataUrl.split(',')[1];
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { bytes, w: cv.width, h: cv.height };
  });
  const N = jpegs.length;
  const totalObjs = 2 + N * 3;
  const objOffsets = new Array(totalObjs + 1).fill(0);
  write('%PDF-1.4\n');
  objOffsets[1] = offset;
  write('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  objOffsets[2] = offset;
  const kids = [];
  for (let i = 0; i < N; i++) kids.push((3 + i * 3) + ' 0 R');
  write(`2 0 obj\n<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${N} >>\nendobj\n`);
  for (let i = 0; i < N; i++){
    const j = jpegs[i];
    const pageObj = 3 + i * 3, imgObj = 4 + i * 3, contObj = 5 + i * 3;
    const pw = (j.w * 72 / 96).toFixed(2), ph = (j.h * 72 / 96).toFixed(2);
    objOffsets[pageObj] = offset;
    write(`${pageObj} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] ` +
      `/Resources << /XObject << /Im0 ${imgObj} 0 R >> >> /Contents ${contObj} 0 R >>\nendobj\n`);
    objOffsets[imgObj] = offset;
    write(`${imgObj} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} ` +
      `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.bytes.length} >>\nstream\n`);
    writeBytes(j.bytes);
    write('\nendstream\nendobj\n');
    const content = `q\n${pw} 0 0 ${ph} 0 0 cm\n/Im0 Do\nQ\n`;
    const cb = enc.encode(content);
    objOffsets[contObj] = offset;
    write(`${contObj} 0 obj\n<< /Length ${cb.length} >>\nstream\n`);
    writeBytes(cb);
    write('endstream\nendobj\n');
  }
  const xrefOff = offset;
  write(`xref\n0 ${totalObjs + 1}\n`);
  write('0000000000 65535 f \n');
  for (let i = 1; i <= totalObjs; i++){
    write(String(objOffsets[i]).padStart(10, '0') + ' 00000 n \n');
  }
  write(`trailer\n<< /Size ${totalObjs + 1} /Root 1 0 R >>\nstartxref\n${xrefOff}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}
function timeTag(){
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}${p(t.getMonth() + 1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}`;
}
function wrapTextLines(c, text, maxW){
  const out = [];
  for (const para of String(text).split('\n')){
    if (!para){ out.push(''); continue; }
    let cur = '';
    for (const ch of para){
      const test = cur + ch;
      if (cur && c.measureText(test).width > maxW){ out.push(cur); cur = ch; }
      else cur = test;
    }
    out.push(cur);
  }
  return out;
}
function roundRect(c, x, y, w, h, r){
  if (c.roundRect){ c.beginPath(); c.roundRect(x, y, w, h, r); }
  else {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
}
function downloadCanvas(cv, msg){
  cv.toBlob(blob => {
    if (!blob){ toast('导出失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = `标注_${timeTag()}.png`;
    a.href = url;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast(msg || '导出成功');
  }, 'image/png');
}
async function exportProject(){
  if (!pages.length){ toast('还没有任何页面'); return; }
  showLoading('正在打包项目…');
  try {
    if (activeIdx >= 0 && activeIdx < pages.length){
      const cur = pages[activeIdx];
      cur.annotations = annotations;
      cur.historyStack = historyStack;
      cur.zoom = zoom;
    }
    const data = {
      format: 'image-annotation-project', version: 1,
      createdAt: new Date().toISOString(),
      activeIdx: activeIdx, idSeq, noteSeq,
      pages: []
    };
    for (let i = 0; i < pages.length; i++){
      showLoading(`打包第 ${i + 1}/${pages.length} 页…`);
      const p = pages[i];
      let dataUrl;
      if (p._exportDataUrl){
        dataUrl = p._exportDataUrl;
      } else {
        const c = document.createElement('canvas');
        c.width = p.img.naturalWidth;
        c.height = p.img.naturalHeight;
        const cx = c.getContext('2d');
        cx.fillStyle = '#ffffff';
        cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(p.img, 0, 0);
        dataUrl = c.toDataURL('image/jpeg', 0.92);
        p._exportDataUrl = dataUrl;
      }
      data.pages.push({ image: dataUrl, annotations: p.annotations, zoom: p.zoom || 0 });
    }
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `标注项目_${timeTag()}${PROJECT_EXT}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`已导出项目（${pages.length} 页）`);
  } catch (err){
    console.error(err);
    toast('导出项目失败：' + err.message);
  } finally { hideLoading(); }
}
async function loadProjectData(data){
  if (!data || data.format !== 'image-annotation-project' || !Array.isArray(data.pages)){
    throw new Error('不是有效的项目文件');
  }
  pages.length = 0; activeIdx = -1;
  img = null; annotations = []; historyStack = []; zoom = 1;
  notesLeft.innerHTML = ''; notesRight.innerHTML = '';
  cardEls.clear(); linkLayer.innerHTML = '';
  invalidateBaseCanvas();
  for (let i = 0; i < data.pages.length; i++){
    showLoading(`载入第 ${i + 1}/${data.pages.length} 页…`);
    const pd = data.pages[i];
    const im = await dataURLToImage(pd.image);
    const anns = Array.isArray(pd.annotations) ? pd.annotations : [];
    let maxId = 0;
    for (const a of anns) if (typeof a.id === 'number' && a.id > maxId) maxId = a.id;
    idSeq = Math.max(idSeq, maxId + 1);
    for (const a of anns){
      if (a.type === 'image' && a._src && !imageCache.has(a._src)){
        dataURLToImage(a._src).then(im2 => {
          imageCache.set(a._src, im2);
          if (pages[activeIdx] && pages[activeIdx].annotations === annotations) render();
        }).catch(() => {});
      }
    }
    pages.push({
      id: pageIdSeq++, img: im, thumb: makeThumb(im),
      annotations: anns, historyStack: [], zoom: pd.zoom || 0,
      dirty: true, _blob: null, _exportDataUrl: pd.image
    });
  }
  if (typeof data.idSeq === 'number') idSeq = Math.max(idSeq, data.idSeq);
  if (typeof data.noteSeq === 'number') noteSeq = data.noteSeq;
  renderPagesBar();
  const initIdx = clamp(Number(data.activeIdx) || 0, 0, Math.max(0, pages.length - 1));
  switchToPage(initIdx, true);
}
async function importProject(file){
  showLoading('正在打开项目…');
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    await loadProjectData(data);
    toast(`已打开项目（${pages.length} 页）`);
    scheduleAutosave();
  } catch (err){
    console.error(err);
    toast('打开项目失败：' + err.message);
  } finally { hideLoading(); }
}

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
function idbPut(key, value){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGet(key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbDelete(key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function idbClear(){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function getPageBlob(page){
  if (page._blob) return page._blob;
  if (page._exportDataUrl){
    page._blob = Promise.resolve(dataURLToBlob(page._exportDataUrl));
    return page._blob;
  }
  page._blob = new Promise(resolve => {
    const c = document.createElement('canvas');
    c.width = page.img.naturalWidth;
    c.height = page.img.naturalHeight;
    const cx = c.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, c.width, c.height);
    cx.drawImage(page.img, 0, 0);
    c.toBlob(b => resolve(b), 'image/jpeg', 0.9);
  });
  return page._blob;
}
function deletePageRecord(id){ return idbDelete(PAGE_PREFIX + id); }
function markDirty(){
  metaDirty = true;
  if (activeIdx >= 0 && pages[activeIdx]) pages[activeIdx].dirty = true;
}
function scheduleAutosave(){
  markDirty();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    if ('requestIdleCallback' in window){
      requestIdleCallback(() => runAutoSave(), { timeout: 3000 });
    } else {
      setTimeout(() => runAutoSave(), 0);
    }
  }, AUTOSAVE_DELAY);
}
async function runAutoSave(){
  if (!pages.length || autosaveBusy) return;
  autosaveBusy = true;
  try {
    if (activeIdx >= 0 && activeIdx < pages.length){
      const cur = pages[activeIdx];
      cur.img = img; cur.annotations = annotations;
      cur.historyStack = historyStack; cur.zoom = zoom;
    }
    if (metaDirty){
      const meta = {
        order: pages.map(p => p.id), activeIdx,
        savedAt: Date.now(), idSeq, noteSeq
      };
      await idbPut(META_KEY, meta);
      metaDirty = false;
    }
    for (const p of pages){
      if (!p.dirty) continue;
      const blob = await getPageBlob(p);
      await idbPut(PAGE_PREFIX + p.id, {
        image: blob, annotations: p.annotations, zoom: p.zoom || 0
      });
      p.dirty = false;
    }
    lastSavedAt = Date.now();
    showSaveStatus('已自动保存');
  } catch (err){
    console.warn('自动保存失败', err);
  } finally { autosaveBusy = false; }
}
async function tryRestoreAutoSave(){
  if (restoreDismissed) return;
  restoreDismissed = true;
  try {
    const meta = await idbGet(META_KEY);
    if (!meta || !Array.isArray(meta.order) || !meta.order.length) return;
    const timeStr = new Date(meta.savedAt).toLocaleString();
    const ok = confirm(
      `发现上次的自动保存（${timeStr}，共 ${meta.order.length} 页）。\n\n` +
      `点击「确定」恢复继续编辑；点击「取消」从空白开始。`
    );
    if (!ok){ await idbClear().catch(() => {}); return; }
    showLoading('正在恢复…');
    pages.length = 0; activeIdx = -1;
    img = null; annotations = []; historyStack = []; zoom = 1;
    notesLeft.innerHTML = ''; notesRight.innerHTML = '';
    cardEls.clear(); linkLayer.innerHTML = '';
    invalidateBaseCanvas();

    let found = 0;
    for (const pid of meta.order){
      const rec = await idbGet(PAGE_PREFIX + pid);
      if (!rec || !rec.image) continue;
      showLoading(`恢复第 ${found + 1}/${meta.order.length} 页…`);
      const im = await dataURLToImage(URL.createObjectURL(rec.image));
      found++;
      const anns = rec.annotations || [];
      for (const a of anns){
        if (a.type === 'image' && a._src && !imageCache.has(a._src)){
          dataURLToImage(a._src).then(im2 => {
            imageCache.set(a._src, im2);
            if (activeIdx >= 0 && pages[activeIdx] && pages[activeIdx].annotations === annotations) render();
          }).catch(() => {});
        }
      }
      pages.push({
        id: pid, img: im, thumb: makeThumb(im),
        annotations: anns,
        historyStack: [], zoom: rec.zoom || 0,
        dirty: false, _blob: Promise.resolve(rec.image)
      });
      pageIdSeq = Math.max(pageIdSeq, pid + 1);
    }
    if (!found){ hideLoading(); return; }
    if (typeof meta.idSeq === 'number') idSeq = Math.max(idSeq, meta.idSeq);
    if (typeof meta.noteSeq === 'number') noteSeq = meta.noteSeq;
    renderPagesBar();
    const initIdx = clamp(Number(meta.activeIdx) || 0, 0, Math.max(0, pages.length - 1));
    switchToPage(initIdx, true);
    toast(`已恢复上次编辑（${pages.length} 页）`);
  } catch (err){
    console.warn('恢复失败', err);
  } finally { hideLoading(); }
}

window.addEventListener('keydown', e => {
  const path = e.composedPath ? e.composedPath() : [];
  if (path.some(el => el && el.tagName && String(el.tagName).toLowerCase() === 'emoji-picker')) return;
  if (e.target === textInput || editingText) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId){
    e.preventDefault();
    pushHistory(deepCopy(annotations));
    const kept = annotations.filter(a => a.id !== selectedId);
    annotations.length = 0;
    for (const x of kept) annotations.push(x);
    selectedId = null;
    renderNotes(true); render(); scheduleLinks(); updateUI();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'F11'){ e.preventDefault(); fullscreenBtn.click(); return; }
  const map = { 'v': 'select', 't': 'text', 'n': 'note', 'h': 'highlight',
                'p': 'pen', 'r': 'rect', 'o': 'ellipse', 'l': 'line', 'w': 'wavy' };
  const k = e.key.toLowerCase();
  if (map[k]){
    tool = map[k];
    selectedId = null;
    updateCursor(); updateUI(); render(); renderNotes(true);
  }
});

function updateCursor(){
  canvas.style.cursor =
    tool === 'text' ? 'text' :
    tool === 'select' ? 'default' : 'crosshair';
}
function updateUI(){
  undoBtn.disabled = historyStack.length === 0;
  clearBtn.disabled = !img || annotations.length === 0;

  toolGroup.querySelectorAll(':scope > button[data-tool]').forEach(b => {
    if (b.id === 'shapeBtn' || b.id === 'moreBtn') return;
    b.classList.toggle('active', b.dataset.tool === tool);
  });

  const isShapeTool = SHAPE_TOOLS.indexOf(tool) >= 0;
  shapeBtn.classList.toggle('active', isShapeTool);
  shapeDrop.querySelectorAll('button[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });

  const isMoreTool = (tool === 'highlight' || tool === 'pen');
  moreBtn.classList.toggle('active', isMoreTool);

  const selAnn = selectedId ? annotations.find(x => x.id === selectedId) : null;
  const showTextOpts = (tool === 'text') || (selAnn && selAnn.type === 'text');
  const showStrokeOpts = (tool === 'pen' || SHAPE_TOOLS.indexOf(tool) >= 0) ||
                         (selAnn && (selAnn.type === 'pen' || SHAPE_TOOLS.indexOf(selAnn.type) >= 0));
  textOpts.style.display = showTextOpts ? 'flex' : 'none';
  textBgOpts.style.display = showTextOpts ? 'flex' : 'none';
  strokeOpts.style.display = showStrokeOpts ? 'flex' : 'none';

  updateCursor();
}

['dragenter', 'dragover'].forEach(ev =>
  viewportEl.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); })
);
viewportEl.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation();
  const files = e.dataTransfer.files;
  if (files && files.length) addPagesFromFiles(files);
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (editingText){
      applyTextInputStyle();
      autoSizeTextInput();
    }
    scheduleLinks();
  }, 80);
});
window.addEventListener('beforeunload', () => {
  if (!pages.length) return;
  if (autosaveBusy) return;
  try { runAutoSave(); } catch (_) {}
});

updateUI();
updateCursor();
updatePagesBarVisibility();
fontSizeInput.value = currentFontSize;
markBgPresetActive(currentBgColor);
setTimeout(tryRestoreAutoSave, 400);

})();
</script>
